<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Registrarse Jerseys Hub</title>
</head>
<body class="pagina-form">
    <nav class="navbar">
        <div class="logo">
            <img src="img/logo.png" alt="Logo">
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="formulario.html" class="login">Registrarse</a></li>
        </ul>
    </nav>

    <main class="contenedor-form">
        <form class="caja-form" id="formulario">
            <h1>Formulario de Registro</h1>
            <p class="subtitulo">Completa todos los campos para crear tu cuenta</p>

            <fieldset>
                <legend>Datos Personales</legend>
                <div class="campo">
                    <label class="texto-campo" for="nombre">Nombre completo <span class="obligatorio">*</span></label>
                    <input type="text" id="nombre" placeholder="Ej: Carlos Sanchez" required>
                </div>
                <div class="campo">
                    <label class="texto-campo" for="email">Correo electrónico <span class="obligatorio">*</span></label>
                    <input type="email" id="email" placeholder="Ej: carlossanchez8@gmail.com" required>
                </div>
                <div class="campo">
                    <label class="texto-campo" for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" placeholder="Ej: +54 11 1234-5678">
                </div>
                <div class="campo">
                    <label class="texto-campo" for="nacimiento">Fecha de nacimiento</label>
                    <input type="date" id="nacimiento">
                </div>
            </fieldset>

            <fieldset>
                <legend>Información Adicional</legend>
                <div class="campo">
                    <label class="texto-campo" for="pais">País <span class="obligatorio">*</span></label>
                    <select id="pais" required>
                        <option value="">Selecciona un país...</option>
                        <option>Argentina</option>
                        <option>Chile</option>
                        <option>Uruguay</option>
                        <option>España</option>
                        <option>Otro</option>
                    </select>
                </div>
                <div class="campo">
                    <span class="texto-campo" style="display:block;font-size:.75rem;font-weight:700;margin-bottom:6px">Género</span>
                    <div class="opciones">
                        <label class="opcion"><input type="radio" name="genero" value="masculino"> Masculino</label>
                        <label class="opcion"><input type="radio" name="genero" value="femenino"> Femenino</label>
                        <label class="opcion"><input type="radio" name="genero" value="otro"> Otro</label>
                        <label class="opcion"><input type="radio" name="genero" value="nodecir" checked> Prefiero no decirlo</label>
                    </div>
                </div>
                <div class="campo">
                    <span class="texto-campo" style="display:block;font-size:.75rem;font-weight:700;margin-bottom:6px">Equipos favoritos</span>
                    <div class="opciones">
                        <label class="opcion"><input type="checkbox"> Barcelona</label>
                        <label class="opcion"><input type="checkbox"> Real Madrid</label>
                        <label class="opcion"><input type="checkbox"> Arsenal</label>
                        <label class="opcion"><input type="checkbox"> Manchester United</label>
                        <label class="opcion"><input type="checkbox"> Selecciones</label>
                    </div>
                </div>
                <div class="campo">
                    <label class="texto-campo" for="comentarios">Comentarios</label>
                    <textarea id="comentarios" placeholder="Escribe tus comentarios aquí..."></textarea>
                </div>
            </fieldset>

            <fieldset>
                <legend>Seguridad</legend>
                <div class="campo">
                    <label class="texto-campo" for="pass">Contraseña <span class="obligatorio">*</span></label>
                    <input type="password" id="pass" placeholder="Mínimo 8 caracteres" minlength="8" required>
                </div>
                <div class="campo">
                    <label class="texto-campo" for="pass2">Confirmar contraseña <span class="obligatorio">*</span></label>
                    <input type="password" id="pass2" placeholder="Repite tu contraseña" minlength="8" required>
                </div>
            </fieldset>

            <label class="terminos">
                <input type="checkbox" required>
                <span>Acepto los <a href="#">términos y condiciones</a></span>
            </label>

            <div class="botones">
                <button type="submit" class="btn-enviar">Registrarse</button>
                <button type="reset" class="btn-limpiar">Limpiar formulario</button>
            </div>
            
        </form>
    </main>

    <div class="flex-container" id="flex-container">
        <div class="flex-item">Creditos: Gonzalo Ollari Blascetta</div>
        <div class="flex-item">Contacto: +54 9 11 5143-1316</div>
        <div class="flex-item">Redes Sociales: @gonza_ollari</div>
        <div class="flex-item"><a href="https://github.com/GonzaloOllari">Mi GitHub</a></div>
    </div>

    
</body>
</html>
